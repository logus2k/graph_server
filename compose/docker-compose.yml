# Cortex's knowledge-base ArcadeDB: ONE database per Cortex domain, and nothing else (the user, 2026-11-04: "the ArcadeDB
# instance and volume used by Cortex should have only Cortex domain databases" - the other applications' databases
# moved to ~/env/assets/apps_arcadedb). Clients: Cortex, ingestion-server (writes Cortex's PDF passages) and devaikb
# (reads bancoctt). 26.10.2 since 2026-11-04: its sparse-vector tombstones remove one posting, not the whole record
# (Cortex register #320); 26.9.1 since 2026-10-02; was 26.7.2. Born as an isolated PoC for native dense+sparse
# hybrid search (host port 2490; the noted stack's own ArcadeDB keeps 2480). ZGC, 2G-6G heap.
services:
  arcadedb:
    image: arcadedata/arcadedb:26.10.2
    container_name: graph-server-arcadedb
    environment:
      JAVA_OPTS: >-
        -XX:+UseZGC -XX:+ZGenerational
        -Darcadedb.server.rootPassword=${ARCADEDB_PW:?set ARCADEDB_PW in compose/.env}
        -Darcadedb.server.restoreImportAllowLocalUrls=true
      ARCADEDB_OPTS_MEMORY: "-Xms2G -Xmx6G"
    ports:
      - "2490:2480"      # HTTP API + Studio (live instance owns 2480)
    # Every ArcadeDB folder on a NAMED volume: config holds server-users.jsonl (the root password) - an anonymous
    # volume there is discarded by `docker compose down`. restoreImportAllowLocalUrls: `restore database <name>
    # file:///home/arcadedb/backups/...` - Cortex imports a domain from its backups folder (cortex/kbase/transfer.py);
    # only the root user (Cortex) restores, and ArcadeDB refuses local files and private hosts without it. Where Cortex
    # exports and imports domains, the backups folder is a host folder Cortex shares (deploy/overrides/graph_server.yml,
    # this machine: docker-compose.local.yml).
    volumes:
      - graph_server_data:/home/arcadedb/databases
      - graph_server_config:/home/arcadedb/config
      - graph_server_backups:/home/arcadedb/backups
      - graph_server_log:/home/arcadedb/log
      - graph_server_replication:/home/arcadedb/replication
    networks:
      - default
      - cortex-kb        # where its clients reach it (Cortex, ingestion-server; other apps: docker-compose.local.yml)
    # time to close the databases cleanly (stopped in Docker's default 10 s, every database replayed its log at start)
    stop_grace_period: 2m
    restart: unless-stopped

volumes:
  graph_server_data:
  graph_server_config:
  graph_server_backups:
  graph_server_log:
  graph_server_replication:

networks:
  cortex-kb:
    external: true
